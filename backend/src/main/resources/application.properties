# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:flujoclaro}
quarkus.datasource.password=${DB_PASSWORD:flujoclaro}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/flujoclaro}

# Hibernate / Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# HTTP
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.limits.max-body-size=12M

# JWT
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://flujoclaro.cl
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=86400
smallrye.jwt.new-token.issuer=https://flujoclaro.cl

# Security paths
quarkus.http.auth.permission.public.paths=/api/auth/register,/api/auth/login,/api/auth/forgot-password,/api/auth/reset-password
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# App
app.jwt.issuer=https://flujoclaro.cl
app.jwt.duration-seconds=86400
app.mail.mode=${MAIL_MODE:log}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload.dir=${UPLOAD_DIR:./uploads}
app.demo.enabled=false
app.demo.email=demo@flujoclaro.cl
app.demo.password=Demo1234!

# Mailer (SMTP real cuando MAIL_MODE=smtp y MAIL_MOCK=false)
quarkus.mailer.from=${MAIL_FROM:FlujoClaro <noreply@flujoclaro.cl>}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
quarkus.mailer.mock=${MAIL_MOCK:true}

quarkus.log.category."cl.flujoclaro".level=INFO
