services:
  postgres:
    image: postgres:16-alpine
    container_name: flujoclaro-postgres
    environment:
      POSTGRES_DB: flujoclaro
      POSTGRES_USER: flujoclaro
      POSTGRES_PASSWORD: flujoclaro
    ports:
      - "5432:5432"
    volumes:
      - flujoclaro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flujoclaro -d flujoclaro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flujoclaro_pgdata:
